site_name: VP415 Service Guide
site_description: >-
  A working repair and servicing reference for the Philips VP415 LaserVision ROM
  disc drive, built around the original Philips service manual.
site_url: https://simoninns.github.io/vp415-service-guide/
site_author: Simon Inns

repo_url: https://github.com/simoninns/vp415-service-guide
repo_name: simoninns/vp415-service-guide
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# The archival originals stay in the repository as the single copy of every
# scan, but they are not published: at 918 MB they would take the site to
# 1.12 GB, past the 1 GB ceiling GitHub Pages puts on a published site. The
# derivatives carry the reader - every schematic, photograph and scope trace
# zooms to native resolution, and text pages to 2000 px - and anyone who wants
# the lossless file clones the repository.
exclude_docs: |
  **/assets/originals/

theme:
  name: material
  language: en
  icon:
    logo: material/disc-player
    repo: fontawesome/brands/github
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.action.edit
    - content.code.copy
    - content.tooltips
  palette:
    # Follow the reader's system setting by default, with an explicit override.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/simoninns/vp415-service-guide
      name: This site on GitHub

plugins:
  - search
  # Click-to-zoom for the scanned sheets. Figures link their -preview
  # derivative to the -zoom derivative; glightbox intercepts the link.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - no-lightbox
  - minify:
      minify_html: true
      htmlmin_opts:
        remove_comments: true
  # Populated as pages move; empty is valid and keeps the plugin wired up.
  - redirects:
      redirect_maps: {}

# --strict turns each of these into a build failure.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

